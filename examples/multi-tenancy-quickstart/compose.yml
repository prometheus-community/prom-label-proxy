services:
  proxy:
    image: prometheuscommunity/prom-label-proxy:v0.15.1
    ports:
      - "8080:8080"
    command:
      - "--label=tenant"
      - "--header-name=X-Tenant"
      - "--upstream=http://prometheus:9090"
      - "--insecure-listen-address=0.0.0.0:8080"
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:v3
    ports:
      - "9090:9090"
    entrypoint:
      - "/bin/sh"
      - "-c"
      - |
        echo "
        global:
          scrape_interval: 1s
        scrape_configs:
          - job_name: 'mock-tenant-data'
            static_configs:
              - targets: ['localhost:9090']
            relabel_configs:
              - target_label: tenant
                replacement: tenant-a
        " > /tmp/prometheus.yml
        /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus
